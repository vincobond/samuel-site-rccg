<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snow Support</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="..." crossorigin="anonymous" />

  <!-- Font Awesome CDN -->
  <script src="https://kit.fontawesome.com/your-kit-id.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <!-- Header Section -->
    <header class="header">
      <div class="logo"><i class="fas fa-snowflake"></i> Snow</div>
      <nav>
        <ul class="nav-links">
          <li><a href="#"><i class="fas fa-store"></i> Shop</a></li>
          <li><a href="#"><i class="fas fa-book-open"></i> Learn More</a></li>
          <li><a href="#"><i class="fas fa-gift"></i> Refer, Get $10</a></li>
        </ul>
      </nav>
      <div class="icons">
        <div class="circle"><i class="fas fa-user"></i></div>
        <div class="circle"><i class="fas fa-heart"></i></div>
        <div class="circle"><i class="fas fa-shopping-cart"></i></div>
      </div>
    </header>

    <!-- Main Section -->
    <main>
      <div class="content">
        <!-- Image Section -->
        <div class="image">
          <img src="img/img2.png" alt="Support illustration" />
        </div>

        <!-- Text & Form Section -->
        <div class="text_main">
          <!-- Quick Links -->
          <div class="messa">
            <span class="span_circle"><i class="fas fa-envelope"></i></span>
            <div class="mess"><a href="#">Email Us</a></div>
            <span class="span_circle"><i class="fas fa-question-circle"></i></span>
            <div class="mess"><a href="#">FAQs</a></div>
          </div>

          <!-- Headings -->
          <h4>Can't find what you're looking for?</h4>
          <h1>Ask Us a Question</h1>

          <!-- Contact Form -->
          <div class="form_text">
            <form action="#" method="post">
              <div class="input-icon">
                <i class="fas fa-user"></i>
                <input type="text" name="name" placeholder="Your Name*" required />
              </div>
              <div class="input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" placeholder="Your Email*" required />
              </div>
              <div class="input-icon">
                <i class="fas fa-comment"></i>
                <input type="text" name="question" placeholder="Your Question*" required />
              </div>
              <button type="submit"><i class="fas fa-paper-plane"></i> Send it Our Way</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
